import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def configRoot = rootDir
while (!new File(configRoot, 'app.json').isFile()) {
    configRoot = configRoot.parentFile
    if (configRoot == null) throw new GradleException('Cannot find app.json for watch release identity')
}
def appConfig = new JsonSlurper().parse(new File(configRoot, 'app.json')).expo
def localApiUrl = providers.gradleProperty('watchApiBaseUrl').orNull
def localCertificate = providers.gradleProperty('watchLocalCertificate').orNull
def localResources = layout.buildDirectory.dir('generated/watchLocalResources')
def generateLocalNetworkConfig = tasks.register('generateLocalNetworkConfig') {
    inputs.property('certificatePath', localCertificate ?: '')
    if (localCertificate != null) inputs.file(localCertificate)
    outputs.dir(localResources)
    doLast {
        def root = localResources.get().asFile
        root.deleteDir()
        new File(root, 'xml').mkdirs()
        def localTrust = ''
        if (localCertificate != null) {
            new File(root, 'raw').mkdirs()
            new File(root, 'raw/watch_local_ca.pem').bytes = file(localCertificate).bytes
            localTrust = '<domain-config><domain includeSubdomains="false">localhost</domain><trust-anchors><certificates src="@raw/watch_local_ca" /></trust-anchors></domain-config>'
        }
        new File(root, 'xml/watch_network_security_config.xml').text = '<network-security-config><base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system" /></trust-anchors></base-config>' + localTrust + '</network-security-config>'
    }
}
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn(generateLocalNetworkConfig) }
android {
    namespace 'com.paydayplanners.watch'
    compileSdk 36
    defaultConfig {
        testInstrumentationRunner providers.gradleProperty('watchTestRunner').getOrElse('com.paydayplanners.watch.ReminderInstrumentation')
        applicationId appConfig.android.package
        minSdk 30
        targetSdk 36
        versionCode ((appConfig.android.versionCode ?: 1) as int)
        versionName appConfig.version
        buildConfigField 'String', 'API_BASE_URL', '"https://paydayplanners.com/api/v1"'
    }
    signingConfigs {
        debug {
            def localKeystore = providers.gradleProperty('watchDebugKeystore').orNull
            if (localKeystore != null) storeFile file(localKeystore)
        }
    }
    buildTypes {
        debug {
            if (localApiUrl != null) {
                if (!(localApiUrl ==~ /https:\/\/[a-zA-Z0-9.:\/-]+/)) throw new GradleException('Invalid debug API URL')
                buildConfigField 'String', 'API_BASE_URL', '"' + localApiUrl + '"'
            }
        }
    }
    sourceSets.debug.res.srcDir(localResources)
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.test.resources.srcDir('../../contracts')
}
// EAS injects the existing app's upload key after preparing this project.
// Fail rather than produce an unsigned artifact that looks ready for Play.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        def signing = android.buildTypes.release.signingConfig
        if (signing == null || !signing.isSigningReady() || signing.name == 'debug') {
            throw new GradleException('Release signing is missing. Use npm run watch:release:wear to reuse the existing EAS credentials.')
        }
    }
}
tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach { dependsOn(verifyReleaseSigning) }
dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-material3:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
