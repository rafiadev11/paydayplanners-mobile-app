build:
  name: Wear OS release for the existing Payday Planner listing
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Prepare the native Wear OS project
        command: node scripts/prepare-wear-build.cjs
    - eas/inject_android_credentials
    - eas/configure_android_version
    - eas/run_gradle:
        inputs:
          command: :app:bundleRelease
    - eas/find_and_upload_build_artifacts
